<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events — Mad Vervet Hostel</title>
  <meta name="description" content="Nightly events at Mad Vervet Hostel: open mic nights, Ethiopian coffee ceremonies, Bole pub crawls, BBQ nights and games nights. Events at our Addis Ababa and Nairobi hostels.">
  <meta property="og:title" content="Events at Mad Vervet Hostel">
  <meta property="og:description" content="Something every night: open mic, coffee ceremony, pub crawls, BBQs. Events at our Addis Ababa and Nairobi hostels.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://madvervet.com/events.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Partials load via fetch(): a local dev server is required — they won't load over file:// -->
</head>
<body>
  <div id="site-header"></div>
  <main id="main">
    <section class="hero">
      <h1>Events</h1>
      <p class="tagline">Never a Quiet Night</p>
      <p class="lede">Pick a location to see what's on — the real lineup gets posted at the hostel and on our socials.</p>
    </section>
    <div class="wave-divider wave-divider--ink" aria-hidden="true">
      <svg viewBox="0 0 1440 60" preserveAspectRatio="none"><path d="M0 60 C360 0 1080 0 1440 60 L1440 60 L0 60 Z" fill="currentColor"/></svg>
    </div>
    <section class="section" aria-labelledby="events-heading">
      <div class="container">
        <div class="section-head">
          <span class="kicker">What's On</span>
          <h2 id="events-heading">Events by Location</h2>
        </div>
        <div class="location-tabs" role="tablist" aria-label="Hostel location">
          <button type="button" class="location-tab" role="tab" id="tab-addis-ababa" aria-controls="event-grid" data-location="addis-ababa">Addis Ababa</button>
          <button type="button" class="location-tab" role="tab" id="tab-nairobi" aria-controls="event-grid" data-location="nairobi">Nairobi</button>
        </div>
        <div class="card-grid" id="event-grid"></div>
      </div>
    </section>
    <section class="section section--ink text-center">
      <div class="container">
        <h2>Want the Real Schedule?</h2>
        <p>Ask at reception or follow us on socials — events change weekly.</p>
        <a class="btn" href="contact.html">Ask Us</a>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/nav.js" defer></script>
  <script src="js/include.js" defer></script>
  <script src="js/chat-widget.js" defer></script>
  <script src="js/events.js" defer></script>
</body>
</html>
