<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tours &amp; Adventures — Mad Vervet Hostel</title>
  <meta name="description" content="Book tours from Mad Vervet Hostel: Lalibela churches, Simien Mountains trek, Omo Valley, Maasai Mara safari, Diani Beach and Lake Nakuru. Prices in USD.">
  <meta property="og:title" content="Tours &amp; Adventures — Mad Vervet">
  <meta property="og:description" content="Ethiopia and Kenya tours run with trusted local partners — safaris, treks and cultural trips from our hostel desks.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://madvervet.com/tours.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Partials load via fetch(): a local dev server is required — they won't load over file:// -->
</head>
<body>
  <div id="site-header"></div>
  <main id="main">
    <section class="hero">
      <h1>Tours &amp; Adventures</h1>
      <p class="tagline">Beyond the Bar</p>
      <p class="lede">Pick a country, pick a tour, book it right here. All prices in USD, run with trusted local operators.</p>
    </section>
    <div class="wave-divider wave-divider--ink" aria-hidden="true">
      <svg viewBox="0 0 1440 60" preserveAspectRatio="none"><path d="M0 60 C360 0 1080 0 1440 60 L1440 60 L0 60 Z" fill="currentColor"/></svg>
    </div>
    <section class="section" aria-labelledby="tours-heading">
      <div class="container">
        <div class="section-head">
          <span class="kicker">Step 1</span>
          <h2 id="tours-heading">Choose Your Tour</h2>
        </div>
        <div class="location-tabs" role="tablist" aria-label="Tour country">
          <button type="button" class="location-tab" role="tab" id="tab-ethiopia" aria-controls="tour-grid" data-location="ethiopia">Ethiopia</button>
          <button type="button" class="location-tab" role="tab" id="tab-kenya" aria-controls="tour-grid" data-location="kenya">Kenya</button>
        </div>
        <div class="card-grid" id="tour-grid"></div>
      </div>
    </section>
    <section class="section section--white" id="purchase-section" aria-labelledby="purchase-heading">
      <div class="container" style="max-width: 640px;">
        <div class="section-head">
          <span class="kicker kicker--pink">Step 2</span>
          <h2 id="purchase-heading">Purchase Your Tour</h2>
        </div>
        <p class="placeholder-note" id="purchase-hint">Select a tour above to book it.</p>
        <form id="tour-purchase-form" novalidate hidden>
          <div class="field">
            <label for="tp-tour">Tour</label>
            <input type="text" id="tp-tour" name="tour" readonly>
          </div>
          <div class="field">
            <label for="tp-date">Preferred start date</label>
            <input type="date" id="tp-date" name="date" required>
          </div>
          <div class="field">
            <label for="tp-guests">Number of travellers</label>
            <input type="number" id="tp-guests" name="guests" min="1" max="16" value="2" required>
          </div>
          <div class="field">
            <label for="tp-name">Full name</label>
            <input type="text" id="tp-name" name="name" required autocomplete="name">
          </div>
          <div class="field">
            <label for="tp-email">Email</label>
            <input type="email" id="tp-email" name="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="tp-phone">Phone</label>
            <input type="tel" id="tp-phone" name="phone" required autocomplete="tel">
          </div>
          <fieldset class="field payment-options">
            <legend>Payment option</legend>
            <label class="payment-card" for="tp-pay-reserve">
              <input type="radio" id="tp-pay-reserve" name="paymentOption" value="reserve" checked>
              <span>
                <strong>Reserve now, pay at the hostel desk</strong><br>
                No online charge today. Full amount due at the tour desk — cash or card.
              </span>
            </label>
            <label class="payment-card" for="tp-pay-now">
              <input type="radio" id="tp-pay-now" name="paymentOption" value="paynow">
              <span>
                <strong>Pay online now — extra 5% off</strong><br>
                Your card is charged today with an extra 5% discount. Nothing due later.
              </span>
            </label>
          </fieldset>
          <div class="booking-summary" aria-live="polite">
            <h3>Price Summary</h3>
            <dl id="tour-summary-lines"></dl>
          </div>
          <button class="btn btn--pink" type="submit" id="tp-submit">Book Tour</button>
        </form>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/nav.js" defer></script>
  <script src="js/include.js" defer></script>
  <script src="js/chat-widget.js" defer></script>
  <script src="js/tours.js" defer></script>
</body>
</html>
